  function buildDeck(){
    const sel = catSel.value;
    deck = (sel === 'all') ? ALL_WORDS.slice() : ALL_WORDS.filter(w => w[2] === sel);
    idx = 0;
    flipped = false;
    render();
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function render(){
    if (deck.length === 0) return;
    const w = deck[idx];
    wordFront.textContent = w[0];
    wordBack.textContent = w[1];
    catBadge.textContent = catLabel(w[2]);
    wordBack.style.display = flipped ? 'block' : 'none';
    flipHint.style.display = flipped ? 'none' : 'block';
    progressText.textContent = 'card ' + (idx+1) + ' of ' + deck.length;
    updateKnownStats();
  }

  function updateKnownStats(){
    let count = 0;
    for (const w of deck){ if (known[w[0]]) count++; }
    knownCount.textContent = count + ' / ' + deck.length;
    knownBar.style.width = (deck.length ? Math.round(count/deck.length*100) : 0) + '%';
  }


  const LS_KEY = "de2000-known-v1";

  function loadKnown(){
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(err){ return {}; }
  }

  function saveKnown(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(known)); } catch(err){}
  }

  function next(){ if (deck.length===0) return; idx = (idx+1) % deck.length; flipped=false; render(); }
  function prev(){ if (deck.length===0) return; idx = (idx-1+deck.length) % deck.length; flipped=false; render(); }

  card.addEventListener('click', function(){
    flipped = !flipped;
    render();
  });

  document.getElementById('nextBtn').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('prevBtn').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
  document.getElementById('shuffleBtn').addEventListener('click', function(e){ e.stopPropagation(); shuffle(deck); idx=0; flipped=false; render(); });

  document.getElementById('knowBtn').addEventListener('click', function(e){
    e.stopPropagation();
    const w = deck[idx];
    known[w[0]] = true;
    saveKnown();
    next();
  });

  document.getElementById('dontKnowBtn').addEventListener('click', function(e){
    e.stopPropagation();
    const w = deck[idx];
    delete known[w[0]];
    saveKnown();
    next();
  });

  catSel.addEventListener('click', function(e){ e.stopPropagation(); });
  catSel.addEventListener('change', function(){ buildDeck(); });

  known = loadKnown();
  buildDeck();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
